openapi: 3.1.2
info:
  title: API Design Rules - common components
  description: Reusable OpenAPI components for APIs that follow the API Design Rules.
  version: 2.2.0
components:
  headers:
    API-Version:
      description: Semver of this API
      schema:
        type: string
        pattern: ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
        examples:
          - 1.0.0
        externalDocs:
          description: "/core/version-header: Return the full version number in a response header"
          url: https://logius-standaarden.github.io/API-Design-Rules/#/core/version-header
    Link:
      description: Links to the previous, next, last or first pages
      schema:
        type: string
        examples:
          - <https://developer.overheid.nl/api/v1/apis?page=2>; rel="prev", <https://developer.overheid.nl/api/v1/apis?page=3>; rel="next"
        externalDocs:
          description: RFC 8288 Web Linking
          url: https://www.rfc-editor.org/rfc/rfc8288
  responses:
    NoContent:
      description: No content
      headers:
        API-Version:
          $ref: "#/components/headers/API-Version"
    BadRequest:
      description: Bad request
      headers:
        API-Version:
          $ref: "#/components/headers/API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "https://static.developer.overheid.nl/schemas/adr/2.2/ProblemDetails.schema.json"
    Unauthorized:
      description: Unauthorized
      headers:
        API-Version:
          $ref: "#/components/headers/API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "https://static.developer.overheid.nl/schemas/adr/2.2/ProblemDetails.schema.json"
    Forbidden:
      description: Forbidden
      headers:
        API-Version:
          $ref: "#/components/headers/API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "https://static.developer.overheid.nl/schemas/adr/2.2/ProblemDetails.schema.json"
    NotFound:
      description: Resource does not exist
      headers:
        API-Version:
          $ref: "#/components/headers/API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "https://static.developer.overheid.nl/schemas/adr/2.2/ProblemDetails.schema.json"
    NotImplemented:
      description: Method not implemented
      headers:
        API-Version:
          $ref: "#/components/headers/API-Version"
      content:
        application/problem+json:
          schema:
            $ref: "https://static.developer.overheid.nl/schemas/adr/2.2/ProblemDetails.schema.json"
